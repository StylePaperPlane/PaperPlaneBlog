server {
  listen 80;
  server_name blog.paperplane.codes localhost _;

  gzip on;
  gzip_min_length 1k;
  gzip_comp_level 9;
  gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
  gzip_vary on;
  gzip_disable "MSIE [1-6]\.";

  client_max_body_size 100m;

  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
    # 静态文件缓存配置
    expires 1d;  # 设置静态文件缓存过期时间为1天
    add_header Cache-Control "public";
    add_header Service-Worker-Allowed "/" always;
  }

  location ^~ /music/ {
    return 404;
  }

  location /api/ {
    # 此处为后端地址
    proxy_pass ${BACK_API};
  }

  location ~ ^/api/(public|protected)/music(?:/|$) {
    return 404;
  }

  location ^~ /api/internal/ {
    return 404;
  }

  location /uploads/ {
    proxy_pass ${BACK_API};
  }

  # 添加安全头设置
  add_header X-Content-Type-Options "nosniff";
  add_header X-Frame-Options "SAMEORIGIN";
  add_header Service-Worker-Allowed "/" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self'; connect-src 'self' https://media.paperplane.codes https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none';";

  # 防止服务隐藏文件
  location ~ /\. {
    deny all;
  }

  # 日志管理
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
}

server {
  listen 80;
  server_name media.paperplane.codes;
  client_max_body_size 100m;

  location /v1/ {
    proxy_pass http://paperplane_media:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
  }

  location = /health { proxy_pass http://paperplane_media:8090; add_header Cache-Control "no-store" always; }
  location = /openapi.json { proxy_pass http://paperplane_media:8090; add_header Cache-Control "no-store" always; }

  location /assets/ {
    alias /srv/paperplane-media/assets/;
    add_header Access-Control-Allow-Origin "https://blog.paperplane.codes" always;
    add_header Accept-Ranges "bytes" always;
    add_header Cache-Control "public,max-age=31536000,immutable,no-transform" always;
    etag on;
  }

  location /covers/ { alias /srv/paperplane-media/covers/; add_header Access-Control-Allow-Origin "https://blog.paperplane.codes" always; add_header Cache-Control "public,max-age=31536000,immutable" always; }
  location /lyrics/ { alias /srv/paperplane-media/lyrics/; add_header Access-Control-Allow-Origin "https://blog.paperplane.codes" always; add_header Cache-Control "public,max-age=31536000,immutable" always; }
}
