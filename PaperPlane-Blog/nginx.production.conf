server {
  listen 80 default_server;
  server_name _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 444;
  }
}

server {
  listen 80;
  server_name blog.paperplane.codes media.paperplane.codes;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/blog.paperplane.codes/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/blog.paperplane.codes/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  return 444;
}

server {
  listen 443 ssl;
  http2 on;
  server_name blog.paperplane.codes;

  ssl_certificate /etc/letsencrypt/live/blog.paperplane.codes/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/blog.paperplane.codes/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  gzip on;
  gzip_min_length 1k;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
  gzip_vary on;

  client_max_body_size 100m;
  root /usr/share/nginx/html;
  index index.html;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /__media/ {
    return 410;
  }

  location ^~ /music/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://paperplane_backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~ ^/api/(public|protected)/music(?:/|$) {
    return 404;
  }

  location ^~ /api/internal/ {
    return 404;
  }

  location /uploads/ {
    proxy_pass http://paperplane_backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ~ /\. {
    deny all;
  }

  add_header Service-Worker-Allowed "/" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://at.alicdn.com https://cdn.staticfile.org; img-src 'self' data: https:; font-src 'self' https://at.alicdn.com https://cdn.staticfile.org; media-src 'self' blob:; connect-src 'self' https://media.paperplane.codes https://challenges.cloudflare.com https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none';" always;
}

server {
  listen 443 ssl;
  http2 on;
  server_name media.paperplane.codes;

  ssl_certificate /etc/letsencrypt/live/media.paperplane.codes/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/media.paperplane.codes/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:MEDIA_SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 100m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /v1/ {
    proxy_pass http://paperplane_media:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
  }

  location = /health { proxy_pass http://paperplane_media:8090; add_header Cache-Control "no-store" always; }
  location = /openapi.json { proxy_pass http://paperplane_media:8090; add_header Cache-Control "no-store" always; }

  location /assets/ {
    alias /srv/paperplane-media/assets/;
    add_header Access-Control-Allow-Origin "https://blog.paperplane.codes" always;
    add_header Accept-Ranges "bytes" always;
    add_header Cache-Control "public,max-age=31536000,immutable,no-transform" always;
    etag on;
  }

  location /covers/ {
    alias /srv/paperplane-media/covers/;
    add_header Access-Control-Allow-Origin "https://blog.paperplane.codes" always;
    add_header Cache-Control "public,max-age=31536000,immutable" always;
  }

  location /lyrics/ {
    alias /srv/paperplane-media/lyrics/;
    add_header Access-Control-Allow-Origin "https://blog.paperplane.codes" always;
    add_header Cache-Control "public,max-age=31536000,immutable" always;
  }
}
